name: IG トークン延命（週1）

on:
  schedule:
    # 毎週月曜 03:00 UTC（＝月曜12:00 JST）。60日で切れるトークンを週1で延ばす。
    # 週1にしておけば、1回や2回こけても期限までに必ず間に合う
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: トークンを延命してSecretに書き戻す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 tools/ig_refresh_token.py
