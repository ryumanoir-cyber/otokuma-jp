name: IG トークン延命（月1）

on:
  schedule:
    # 毎月1日 03:00 UTC。60日で切れるトークンを月1で延ばしておく
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: トークンを更新してSecretに書き戻す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 tools/ig_refresh_token.py
