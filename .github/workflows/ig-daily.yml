name: IG 毎日21時の投稿

on:
  schedule:
    # GitHubのcronは「その時刻に必ず走る」保証が無い。実測で5時間半遅れた日も、
    # 一度も発火しなかった日もある（2026-09-21, 09-22）。なので複数回ためす。
    # ig_publish.py が毎回Instagramに問い合わせて投稿済みかを見るので、
    # 何回走っても二重投稿にはならない。
    - cron: "0 12 * * *"     # 21:00 JST ← 本命
    - cron: "30 12 * * *"    # 21:30 JST
    - cron: "0 13 * * *"     # 22:00 JST
    - cron: "0 14 * * *"     # 23:00 JST
    - cron: "0 0 * * *"      #  9:00 JST ← 夜が全滅した時の最後の救済
  workflow_dispatch:
    # 手動実行もできるようにしておく（取りこぼした日のリカバリ用）

concurrency:
  group: ig-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 翌日分をカルーセル投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 tools/ig_publish.py

      # 在庫切れは正常終了なので通知が飛ばない。ここで別ステップにして、
      # 残りが少なくなったらわざと失敗させ、補充をメールで知らせる。
      #
      # 1日に何度も走るワークフローなので、毎回やるとメールが何通も飛ぶ。
      # 本命（21:00 JST）と手動実行のときだけ見る。1日1通で足りる。
      - name: 在庫チェック（少なくなったら通知）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        run: python3 tools/ig_stock_check.py
